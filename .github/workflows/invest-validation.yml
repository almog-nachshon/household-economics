name: Investment site validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/opportunity-discovery-offline, main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          DATABASE_URL: file:./ci.db
          AUTH_PASSWORD_HASH: scrypt:deadbeef:deadbeef
