# Deployed at /opt/finance on the VoltShare server. No ports: VoltShare's Caddy
# reaches this service over the voltshare_default network.
services:
  finance-app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: file:/data/home2030.db
    volumes:
      - ./data:/data
    networks:
      - voltshare_default

networks:
  voltshare_default:
    external: true
